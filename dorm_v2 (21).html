  const _hugoTargetPos=new THREE.Vector3();
  const _hugoTargetQuat=new THREE.Quaternion();
  let _hugoTargetValid=false;

  // Bone map — FK control bones (thigh_fkL, shin_fkL, etc.) drive pose; DEF bones are deform chain
  // Primary names match Rigify export (suffixes like _104 may vary between exports)
  const B = {
    hips:'hips_148',
    spine:'DEF-spine_142',
    spine1:'DEF-spine001_141',
    spine2:'DEF-spine002_140',
    chest:'chest_149',
    lthigh:'thigh_fkL_104',
    lthigh2:'DEF-thighL001_115',
    lshin:'shin_fkL_103',
    lshin2:'DEF-shinL001_113',
    lfoot:'foot_fkL_101',
    rthigh:'thigh_fkR_122',
    rthigh2:'DEF-thighR001_133',
    rshin:'shin_fkR_121',
    rshin2:'DEF-shinR001_131',
    rfoot:'foot_fkR_119',
    luarm:'upper_arm_fkL_17',
    luarm2:'DEF-upper_armL001_27',
    lfarm:'forearm_fkL_16',
    ruarm:'upper_arm_fkR_47',
    ruarm2:'DEF-upper_armR001_57',
    rfarm:'forearm_fkR_46',
    neck:'neck_166',
    head:'head_160',
  };
  const B_FALLBACK = {
    lthigh:[/thigh_fk[\._]?l/i,/def-?thighl/i], rthigh:[/thigh_fk[\._]?r/i,/def-?thighr/i],
    lshin:[/shin_fk[\._]?l/i,/def-?shinl/i], rshin:[/shin_fk[\._]?r/i,/def-?shinr/i],
    lfoot:[/foot_fk[\._]?l/i], rfoot:[/foot_fk[\._]?r/i],
    luarm:[/upper_arm_fk[\._]?l/i,/def-?upper_arml/i], ruarm:[/upper_arm_fk[\._]?r/i,/def-?upper_armr/i],
    lfarm:[/forearm_fk[\._]?l/i], rfarm:[/forearm_fk[\._]?r/i],
    spine:[/def-?spine(?!0)/i], spine1:[/def-?spine0?01/i], spine2:[/def-?spine0?02/i],
    hips:[/^hips/i], chest:[/^chest/i], neck:[/^neck/i], head:[/^head/i],
    lthigh2:[/def-?thighl0?01/i], rthigh2:[/def-?thighr0?01/i],
    lshin2:[/def-?shinl0?01/i], rshin2:[/def-?shinr0?01/i],
    luarm2:[/def-?upper_arml0?01/i], ruarm2:[/def-?upper_armr0?01/i],
  };

  function bk(k){
    let b=_hugoBones[B[k]]||null;
    if(!b&&B_FALLBACK[k]){
      const names=Object.keys(_hugoBones);
      for(const pat of B_FALLBACK[k]){
        const found=names.find(n=>pat.test(n));
        if(found){b=_hugoBones[found];break;}
      }
    }
    return b;
  }

  function runBoneTest(){
    if(!window._mjBoneTest) return;
    if(!hugoRoot) return;
    if(!_hugoBones || Object.keys(_hugoBones).length===0) return;
    const _lt=bk('lthigh'), _ls=bk('lshin');
    const _rt=bk('rthigh'), _rs=bk('rshin');
    const _sw=Math.sin(performance.now()/400);
    if(_lt){_lt.rotation.x=_sw*0.6;}
    if(_ls){_ls.rotation.x=Math.max(0,-_sw)*0.5;}
    if(_rt){_rt.rotation.x=-_sw*0.6;}
    if(_rs){_rs.rotation.x=Math.max(0,_sw)*0.5;}
  }

  // Client-side collision: prevent Hugo phasing through floor/furniture (MuJoCo sim has no dorm geometry)
  // R includes arm reach so arms don't clip through beds/walls
  const FLOOR_Y=0,HUGO_FLOOR_MIN=FLOOR_Y+0.03,HUGO_CEILING_MAX=typeof room!=='undefined'?room.h-0.15:2.6;
  function clampHugoToDormCollisions(pos){
    const R=0.65,MARGIN=0.42,PUSH=0.14,cy=pos.y+0.9;
    if(pos.y<HUGO_FLOOR_MIN)pos.y=HUGO_FLOOR_MIN;
    if(pos.y>HUGO_CEILING_MAX)pos.y=HUGO_CEILING_MAX;
    const rMinX=-room.w/2+MARGIN,rMaxX=room.w/2-MARGIN,rMinZ=-room.d/2+MARGIN,rMaxZ=FRONT_Z-MARGIN;
    pos.x=Math.max(rMinX,Math.min(rMaxX,pos.x));
    pos.z=Math.max(rMinZ,Math.min(rMaxZ,pos.z));
    const furniture=[bedLeftFrame,bedLeftMatt,bedRightFrame,bedRightMatt,wardrobe,DRS,fridge,desk,fryer];
    const w2=scene.getObjectByName('wardrobe2');if(w2)furniture.push(w2);
    if(!window._hugoCollisionBoxes){
      window._hugoCollisionBoxes=[];
      furniture.forEach(o=>{
        if(!o)return;
        o.updateMatrixWorld(true);
        const b=new THREE.Box3().setFromObject(o);
        const pad=R+PUSH;
        window._hugoCollisionBoxes.push({min:new THREE.Vector3(b.min.x-pad,b.min.y-pad,b.min.z-pad),max:new THREE.Vector3(b.max.x+pad,b.max.y+pad,b.max.z+pad)});
      });
    }
    for(const box of window._hugoCollisionBoxes){
      const cx=pos.x,cz=pos.z;
      if(cx>=box.min.x-R&&cx<=box.max.x+R&&cy>=box.min.y-R&&cy<=box.max.y+R&&cz>=box.min.z-R&&cz<=box.max.z+R){
        const dx1=cx-box.min.x,dx2=box.max.x-cx,dy1=cy-box.min.y,dy2=box.max.y-cy,dz1=cz-box.min.z,dz2=box.max.z-cz;
        const m=Math.min(dx1,dx2,dy1,dy2,dz1,dz2);
        if(m===dx1){pos.x=box.min.x-R-PUSH;}else if(m===dx2){pos.x=box.max.x+R+PUSH;}
        else if(m===dy1){pos.y=Math.max(HUGO_FLOOR_MIN,box.min.y-R-0.9-PUSH);}
        else if(m===dy2){pos.y=Math.min(HUGO_CEILING_MAX,box.max.y+R-0.9+PUSH);}
        else if(m===dz1){pos.z=box.min.z-R-PUSH;}else{pos.z=box.max.z+R+PUSH;}
      }
    }
    if(pos.y<HUGO_FLOOR_MIN)pos.y=HUGO_FLOOR_MIN;
    if(pos.y>HUGO_CEILING_MAX)pos.y=HUGO_CEILING_MAX;
    pos.x=Math.max(rMinX,Math.min(rMaxX,pos.x));
    pos.z=Math.max(rMinZ,Math.min(rMaxZ,pos.z));
  }

  // A-pose offset: Rigify rest pose is T-pose (arms out). Add this to arm rotations so that
  // "0" from MuJoCo = arms down (A-pose), not stiff T-pose. Applied only in physics mode.
  const REST_POSE_ARM_X = -Math.PI/2;

  // ═══ MUJOCO IS THE SINGLE SOURCE OF TRUTH FOR HUGO WHEN CONNECTED ═══
  // No "Lay on bed" key, no hardcoded pose. Hugo stays hidden until first physics frame; then ONLY this
  // function updates position, quaternion, and bones. Body lay/dangle comes from real-time physics only.
  // When _mjReady is true, ONLY this function updates hugoRoot.position, hugoRoot.quaternion,
  // and leg/arm bone rotations (unless window._mjBoneTest is on — then runBoneTest() drives legs).
  // Server sends: pos, quat, lhip[3], lknee, lankle, rhip[3], rknee, rankle. We normalize lhip/rhip to lhip_x etc.
  function applyMjDataToHugo(s){
    if(!s)return;
    if(!hugoRoot){
      if(!window._mjNoRootLogged){window._mjNoRootLogged=true;
        console.warn('[MuJoCo] physics arriving but hugoRoot=null. Load Hugo.glb first.');}
      return;
    }
    if(!hugoRoot.visible){ hugoRoot.visible=true; show('Real-time physics only — Hugo pose from sim (lay/dangle from physics).'); }
    // Log incoming keys every 120 frames to diagnose server format
    if(!window._mjKeyLog) window._mjKeyLog=0;
    window._mjKeyLog++;
    if(window._mjKeyLog % 120 === 1){
      console.log('[MuJoCo] frame keys:', Object.keys(s));
      const lt=bk('lthigh');
      console.log('[MuJoCo] lthigh bone resolved:', lt ? lt.name : 'NULL — bone not found');
      console.log('[MuJoCo] lhip:', s.lhip, 'lknee:', s.lknee, 'rhip:', s.rhip);
    }
    if(!window._mjApplyLogged){window._mjApplyLogged=true;
      console.log('[MuJoCo] applyMjDataToHugo firing! keys=',Object.keys(s));
      console.log('[MuJoCo] hugoRoot=',hugoRoot.name,'dormSpawn=',hugoRoot.userData.dormSpawn);
      console.log('[MuJoCo] _hugoBones count=',Object.keys(_hugoBones).length);
    }
    const sc=hugoRoot.scale.x;

    // Accept both server formats:
    // - flat joints: lhip_x, lhip_y, lhip_z, rhip_x...
    // - packed arrays: lhip:[x,y,z], rhip:[x,y,z]
    const lhipArr = Array.isArray(s.lhip) ? s.lhip : null;
    const rhipArr = Array.isArray(s.rhip) ? s.rhip : null;
    if(lhipArr && s.lhip_x===undefined){ s.lhip_x=lhipArr[0]; s.lhip_y=lhipArr[1]; s.lhip_z=lhipArr[2]; }
    if(rhipArr && s.rhip_x===undefined){ s.rhip_x=rhipArr[0]; s.rhip_y=rhipArr[1]; s.rhip_z=rhipArr[2]; }

    // Root position — offset from first frame so Hugo stays in dorm spawn (matches hugo_viewer coord transform)
    // MuJoCo: x=fwd,y=left,z=up → Three: x=right,y=up,z=back → (px,py,pz)->(px*sc,pz*sc,-py*sc)
    // Write to target; renderFrame lerps so motion looks like fall/gravity, not teleport
    if(s.pos){
      if(!_mjOrigin)_mjOrigin={x:s.pos[0],y:s.pos[1],z:s.pos[2]};
      const dx=s.pos[0]-_mjOrigin.x, dy=s.pos[1]-_mjOrigin.y, dz=s.pos[2]-_mjOrigin.z;
      const base=hugoRoot.userData.dormSpawn||{x:0,y:0,z:0};
      let py=base.y+dz*sc, pz=base.z-dy*sc;
      _hugoTargetPos.set(base.x+dx*sc, py, pz);
      clampHugoToDormCollisions(_hugoTargetPos);
      if(!_hugoTargetValid){ hugoRoot.position.copy(_hugoTargetPos); _hugoTargetValid=true; }
    }

    // Root quaternion — physics only; smooth slerp to MuJoCo quat
    if(s.quat){
      const[qw,qx,qy,qz]=s.quat;
      _mjQ.set(qx,qz,-qy,qw);
      _hugoTargetQuat.copy(_mjQ);
      if(!_hugoTargetValid){ hugoRoot.quaternion.copy(_hugoTargetQuat); }
    }

    // When bone test is ON, ignore MuJoCo joint data (runBoneTest() drives legs per-frame)
    if(window._mjBoneTest) return;

    // Left leg — each joint driven individually from physics
    const lhip=Array.isArray(s.lhip)?s.lhip:[s.lhip_x||0,s.lhip_y||0,s.lhip_z||0];
    const lh=bk('lthigh');
    if(lh){lh.rotation.x=lhip[0];lh.rotation.y=lhip[1];lh.rotation.z=lhip[2];}
    const lh2=bk('lthigh2');if(lh2)lh2.rotation.x=lhip[0]*0.4;
    const ls=bk('lshin');if(ls)ls.rotation.x=s.lknee!==undefined?s.lknee:0;
    const ls2=bk('lshin2');if(ls2)ls2.rotation.x=(s.lknee!==undefined?s.lknee:0)*0.5;
    const lf=bk('lfoot');if(lf&&s.lankle!==undefined)lf.rotation.x=s.lankle;

    // Right leg
    const rhip=Array.isArray(s.rhip)?s.rhip:[s.rhip_x||0,s.rhip_y||0,s.rhip_z||0];
    const rh=bk('rthigh');
    if(rh){rh.rotation.x=rhip[0];rh.rotation.y=rhip[1];rh.rotation.z=rhip[2];}
    const rh2=bk('rthigh2');if(rh2)rh2.rotation.x=rhip[0]*0.4;
    const rs=bk('rshin');if(rs)rs.rotation.x=s.rknee!==undefined?s.rknee:0;
    const rs2=bk('rshin2');if(rs2)rs2.rotation.x=(s.rknee!==undefined?s.rknee:0)*0.5;
    const rf=bk('rfoot');if(rf&&s.rankle!==undefined)rf.rotation.x=s.rankle;

    // Spine
    const pz=s.pos?s.pos[2]:0;
    const sp=bk('spine');if(sp)sp.rotation.z=pz*0.05;
    const sp2=bk('spine1');if(sp2)sp2.rotation.z=pz*0.03;

    // Arms — use server joint data when present; add REST_POSE_ARM_X so 0 = arms down (A-pose), not T-pose
    const lua=bk('luarm'),rua=bk('ruarm'),lfarm=bk('lfarm'),rfarm=bk('rfarm');
    const luaArr=Array.isArray(s.lua)?s.lua:null;const ruaArr=Array.isArray(s.rua)?s.rua:null;
    if(lua){
      if(luaArr||s.lshoulder_x!==undefined||s.lua_x!==undefined){
        const luaRot=luaArr||[s.lshoulder_x||s.lua_x||0,s.lshoulder_y||s.lua_y||0,s.lshoulder_z||s.lua_z||0];
        lua.rotation.x=(luaRot[0]||0)+REST_POSE_ARM_X;lua.rotation.y=luaRot[1]!==undefined?luaRot[1]:lua.rotation.y;lua.rotation.z=luaRot[2]!==undefined?luaRot[2]:-0.3;
      }else{lua.rotation.x=REST_POSE_ARM_X-lhip[0]*0.4;lua.rotation.z=-0.3;}
    }
    if(rua){
      if(ruaArr||s.rshoulder_x!==undefined||s.rua_x!==undefined){
        const ruaRot=ruaArr||[s.rshoulder_x||s.rua_x||0,s.rshoulder_y||s.rua_y||0,s.rshoulder_z||s.rua_z||0];
        rua.rotation.x=(ruaRot[0]||0)+REST_POSE_ARM_X;rua.rotation.y=ruaRot[1]!==undefined?ruaRot[1]:rua.rotation.y;rua.rotation.z=ruaRot[2]!==undefined?ruaRot[2]:0.3;
      }else{rua.rotation.x=REST_POSE_ARM_X-rhip[0]*0.4;rua.rotation.z=0.3;}
    }
    if(lfarm&&s.lelbow!==undefined)lfarm.rotation.x=s.lelbow;
    if(rfarm&&s.relbow!==undefined)rfarm.rotation.x=s.relbow;
  }

  // ── Walking Policy — translates high-level intent to MuJoCo joint commands ──
  const _hugoLoco = {
    vx: 0, vz: 0,
    yaw: 0,
    speed: 0,
    _phase: 0,
  };
  window.hugoWalk = function(vx, vz, speed){
    _hugoLoco.vx = vx;
    _hugoLoco.vz = vz;
    _hugoLoco.speed = speed || 1;
  };
  window.hugoStop = function(){
    _hugoLoco.vx = 0; _hugoLoco.vz = 0; _hugoLoco.speed = 0;
  };
  function tickWalkingPolicy(dt){
    if(!_mj || !_mjReady || _mj.readyState !== 1) return;
    _hugoLoco._phase += dt * (_hugoLoco.speed > 0 ? 2.5 : 0);
    const cmd = {
      type: 'locomotion',
      vx:   _hugoLoco.vx,
      vz:   _hugoLoco.vz,
      speed: _hugoLoco.speed,
      yaw:  _hugoLoco.yaw,
      phase: _hugoLoco._phase,
    };
    if(!window._mjCmdLog) window._mjCmdLog=0;
    window._mjCmdLog++;
    if(window._mjCmdLog % 60 === 1){
      console.log('[MuJoCo] sending locomotion cmd:', cmd);
    }
    try{ _mj.send(JSON.stringify(cmd)); } catch(e){}
  }

  // mjConnect is called manually via URL bar or after GLB load — NOT on page load

  function buildHugoProxy(){
    const g=new THREE.Group();
    const mSkin=new THREE.MeshStandardMaterial({color:0xd4a484,roughness:.75});
    const mCloth=new THREE.MeshStandardMaterial({color:0x1c1c2e,roughness:.9});
    const mShoe=new THREE.MeshStandardMaterial({color:0x111111,roughness:.8});
    const torso=new THREE.Mesh(new THREE.CylinderGeometry(.148,.130,.49,12),mCloth);
    torso.position.y=1.125; g.add(torso);
    const rl=new THREE.Mesh(new THREE.CylinderGeometry(.070,.063,.34,10),mCloth);
    rl.position.set(.082,.64,0); g.add(rl);
    const ll=new THREE.Mesh(new THREE.CylinderGeometry(.070,.063,.34,10),mCloth);
    ll.position.set(-.082,.64,0); g.add(ll);

    lsho.position.set(-.082,.026,.025); g.add(lsho);

    const raU=new THREE.Mesh(new THREE.CylinderGeometry(.048,.042,.27,8),mSkin);
    raU.position.set(.21,1.24,-.05); raU.rotation.z=-.36; raU.rotation.x=.28; g.add(raU);

  hugoProxy=buildHugoProxy(); // NOTE: Hugo's physical body in the dorm world. Chaze has no world body.
  hugoProxy.visible=true;
  hugoProxy.position.set(-0.8, 0, -1.2); // NOTE: Hugo fixed spawn — NOT connected to Chaze/player position
  scene.add(hugoProxy);
  let _slFired=false;

  function buildRigMeSign(){
    const canvas=document.createElement('canvas');
    canvas.width=512;canvas.height=160;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='rgba(0,255,120,0.10)';
    const r=28;
    ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(512-r,0);ctx.arcTo(512,0,512,r,r);
    ctx.lineTo(512,160-r);ctx.arcTo(512,160,512-r,160,r);
    ctx.lineTo(r,160);ctx.arcTo(0,160,0,160-r,r);
    ctx.lineTo(0,r);ctx.arcTo(0,0,r,0,r);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,255,120,0.70)';ctx.lineWidth=4;ctx.stroke();
    ctx.fillStyle='#00ff88';
    ctx.font='bold 72px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('RIG ME',256,72);
    ctx.fillStyle='rgba(0,255,120,0.50)';
    ctx.font='26px monospace';
    ctx.fillText('load hugo.glb above ↑',256,128);
    const tex=new THREE.CanvasTexture(canvas);
    const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false,side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1.0,.31),mat);
    mesh.renderOrder=9999;
    return mesh;}
  const rigSign=buildRigMeSign();

  // ── File input — wait for GLTFLoader to be ready ──
  document.getElementById('glbInput').addEventListener('change',e=>{

  function waitForGLTF(cb,tries=0){
    if(window._gltfReady&&window.THREE&&THREE.GLTFLoader){cb();return;}
    if(tries>60){show('GLTFLoader failed to load — check console');return;}
    setTimeout(()=>waitForGLTF(cb,tries+1),100);}

  function loadGLB(file){
    const url=URL.createObjectURL(file);
    const loader=new THREE.GLTFLoader();
    show('Loading Hugo.glb…');
    loader.load(url,gltf=>{
      if(hugoRoot){scene.remove(hugoRoot);hugoRoot=null;}
      hugoRoot=gltf.scene;
      const box=new THREE.Box3().setFromObject(hugoRoot);
      const size=box.getSize(new THREE.Vector3());
      const targetH=DOOR_H*0.805;
      const sc=targetH/size.y;hugoRoot.scale.setScalar(sc);
      const box2=new THREE.Box3().setFromObject(hugoRoot);
      // NOTE: Hugo spawns at fixed dorm position — NEVER at player/Chaze position
      hugoRoot.position.set(-0.8, -box2.min.y, -1.2);
      hugoRoot.userData.dormSpawn={x:hugoRoot.position.x,y:hugoRoot.position.y,z:hugoRoot.position.z};
      _mjOrigin=null; // reset so physics recalibrates from new spawn
      hugoRoot.traverse(obj=>{
        if(obj.isBone||obj.type==='Object3D'){
          const n=obj.name.toLowerCase();
          if(!hugoRightHand&&(n.includes('hand')&&(n.includes('r')||n.includes('right'))&&!n.includes('l'))){
            hugoRightHand=obj;}}});
      hugoRoot.visible=false;
      hugoProxy.visible=false;
      scene.add(hugoRoot);
      buildMjBoneMap(hugoRoot);
      if(!_mjReady)mjConnect();
      document.getElementById('loadHugoBtn').textContent='✓ Hugo Loaded';
      document.getElementById('loadHugoBtn').style.color='#00ff88';
      show('Hugo loaded. Connect MuJoCo (WS URL bar) — Hugo will appear only when physics drives him (no T-pose).');
      URL.revokeObjectURL(url);
    },xhr=>{
      if(xhr.lengthComputable)show(`Loading Hugo: ${Math.round(xhr.loaded/xhr.total*100)}%`);
    },err=>{show('GLB load error: '+err);console.error(err);});
  }

  function loadGLBUrl(url){
    const loader=new THREE.GLTFLoader();
    show('Loading Hugo.glb…');
    loader.load(url,gltf=>{
      if(hugoRoot){scene.remove(hugoRoot);hugoRoot=null;}
      hugoRoot=gltf.scene;
      const box=new THREE.Box3().setFromObject(hugoRoot);
      const size=box.getSize(new THREE.Vector3());
      const targetH=DOOR_H*0.805;
      const sc=targetH/size.y;hugoRoot.scale.setScalar(sc);

    const inB=z>=FRONT_Z+.02&&z<=northWallZ-HM&&x>=-corridorLen/2+HM&&x<=T_X+corridorW-HM;

  const SIM_HZ=120,FIXED_DT=1/120,MAX_FRAME=.05;

  function fixedUpdate(dt){
    player.px=player.x;player.py=player.y;player.pz=player.z;
    if(inp.useTap){inp.useTap=false;useObject(canInteract);}
    const sy=Math.sin(yaw),cy=Math.cos(yaw);
    const fw=(inp.keys['KeyW']?1:0)-(inp.keys['KeyS']?1:0);
    const st=(inp.keys['KeyD']?1:0)-(inp.keys['KeyA']?1:0);
    let wx=fw*(-sy)+st*cy,wz=fw*(-cy)+st*(-sy);
    const wl=Math.hypot(wx,wz);if(wl>0){wx/=wl;wz/=wl;}
    const sprint=inp.keys['ShiftLeft']||inp.keys['ShiftRight'];
    const maxSpd=sprint?cfg.maxSprint:cfg.maxSpd;
    const wasGround=player.onGround;
    if(player.y<=EYE+.001){player.y=EYE;player.vy=0;player.onGround=true;}else player.onGround=false;
    if(wasGround&&!player.onGround)player.coyote=cfg.coyoteT;
    else if(player.onGround)player.coyote=0;else player.coyote=Math.max(0,player.coyote-dt);
    if(inp.keys['Space'])player.jumpBuf=cfg.jumpBufT;else player.jumpBuf=Math.max(0,player.jumpBuf-dt);
    if((player.onGround||player.coyote>0)&&player.jumpBuf>0){
      player.vy=cfg.jumpVel;player.onGround=false;player.coyote=0;player.jumpBuf=0;}
    if(player.onGround){const spd=Math.hypot(player.vx,player.vz);
      if(spd>0){const ns=Math.max(0,spd-spd*cfg.friction*dt);player.vx=player.vx/spd*ns;player.vz=player.vz/spd*ns;}}
    if(wl>0){const accel=player.onGround?cfg.accelGnd:cfg.accelAir;
      const cur=player.vx*wx+player.vz*wz;const add=Math.min(maxSpd-cur,accel*dt);
      if(add>0){player.vx+=wx*add;player.vz+=wz*add;}}
    if(!player.onGround)player.vy-=cfg.gravity*dt;
    let nx=player.x+player.vx*dt,ny=player.y+player.vy*dt,nz=player.z+player.vz*dt;
    if(ny<EYE){ny=EYE;player.vy=0;player.onGround=true;}
    if(ny>room.h-.1){ny=room.h-.1;player.vy=Math.min(0,player.vy);}
    {// collision always runs — FP and 3P both collide
      const inDX=Math.abs(nx-DOOR_X)<=DOORWAY_HALF_W;
      const doorOpen=(doorPivot.userData.theta||0)>=DOOR_OPEN_ENOUGH;
      const RM=.35;
      const rMinX=-room.w/2+RM,rMaxX=room.w/2-RM,rMinZ=-room.d/2+RM,rMaxZ=FRONT_Z-RM;
      const bMaxZ=northWallZ-HM;
      const inStub=player.x>=T_X-.1&&player.x<=T_X+corridorW+.1;
      const inHall=player.z>=FRONT_Z-.02||inStub||inDormRoom(player.x,player.z);
      if(!inHall){
        nx=clamp(nx,rMinX,rMaxX);
        nz=(nz>DOOR_PASS_Z0&&inDX&&doorOpen)?clamp(nz,rMinZ,bMaxZ):clamp(nz,rMinZ,rMaxZ);
      }else{
        if(nz<FRONT_Z&&inDX&&doorOpen&&!inStub){nx=clamp(nx,rMinX,rMaxX);nz=clamp(nz,rMinZ,bMaxZ);}
        else if(!inHallBounds(nx,nz)){
          if(inHallBounds(nx,player.z))nz=player.z;
          else if(inHallBounds(player.x,nz))nx=player.x;
          else{nx=player.x;nz=player.z;}}}}
    player.x=nx;player.y=ny;player.z=nz;
    player.recoilP+=(-player.recoilP)*Math.min(1,dt*cfg.recoilDecay);
    player.recoilK+=(-player.recoilK)*Math.min(1,dt*cfg.kickDecay);
    player.fireCdt=Math.max(0,player.fireCdt-dt);
    // ADS interpolation
    if(!(window.SpawnLoadout&&SpawnLoadout.isActive())){
      const _adsSpd=_wpStats().rate<2?5:8;
      player.adsP=Math.min(1,Math.max(0,player.adsP+(player.adsHeld?_adsSpd:-_adsSpd*1.5)*dt));
    }
    // Per-weapon fire
    if(_ptrLocked&&!(window.SpawnLoadout&&SpawnLoadout.isActive())&&player.fireCdt<=0){
      const _ws=_wpStats();
      const _shouldFire=_ws.auto?inp.fireHeld:(inp.fireHeld&&!player._prevFire);
      if(_shouldFire){
        player.fireCdt=1/_ws.rate;
        player.recoilP+=_ws.recoil;
        player.recoilK=Math.min(1,player.recoilK+_ws.kick*.55);
        fireShot();}
      player._prevFire=inp.fireHeld;}
    if(window.SpawnLoadout&&SpawnLoadout.isActive()){
      SpawnLoadout.setInput({fire:inp.fireHeld&&_ptrLocked});SpawnLoadout.update(dt);}
    tickWalkingPolicy(dt);
  }

  function renderFrame(alpha){

  requestAnimationFrame(loop); // START THE GAME LOOP
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);});
  window._sceneReady=true;
  show('Click to lock • V = FP mode • Load Hugo.glb above');

  // ── AgentTube LLM Bridge — neural cognition layer ────────────────────────────
  const AgentTubeBridge = {
    _interval: null,
    _tickHz: 2,

    start(){
      if(this._interval) return;
      this._interval = setInterval(()=> this._tick(), 1000/this._tickHz);
      console.log('[AgentTube] LLM bridge started at', this._tickHz, 'hz');
    },

    stop(){
      clearInterval(this._interval); this._interval=null;
      window.hugoStop&&window.hugoStop();
    },

    _tick(){
      if(!window.AgentLLM || typeof window.AgentLLM.getIntent !== 'function') return;
      const state = {
        hugoPos: hugoRoot ? { x: hugoRoot.position.x, y: hugoRoot.position.y, z: hugoRoot.position.z } : null,
        playerPos: { x: player.x, y: player.y, z: player.z },
        physicsConnected: _mjReady,
        currentMotion: { vx: _hugoLoco.vx, vz: _hugoLoco.vz, speed: _hugoLoco.speed },
        hugoHealth: HugoAgent.state.health,
        timestamp: performance.now(),
      };
      const intent = window.AgentLLM.getIntent(state);
      if(!intent) return;
      if(intent.action === 'walk'){
        window.hugoWalk(intent.vx||0, intent.vz||0, intent.speed||1);
      } else if(intent.action === 'stop'){
        window.hugoStop();
      }
    },
  };
  window.AgentTubeBridge = AgentTubeBridge;
  console.log('[AgentTube] Bridge ready. Physics runs independently. Call AgentTubeBridge.start() to activate LLM cognition.');
});
</script>
</body>
